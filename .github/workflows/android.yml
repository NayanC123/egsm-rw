name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.2
          components: |
            platform-tools
            platforms;android-33
            build-tools;33.0.2
            cmdline-tools;latest

      - name: Ensure SDK components & accept licenses
        run: |
          export ANDROID_SDK_ROOT=${{ env.ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk }}
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "cmdline-tools;latest" || true
          yes | sdkmanager --licenses

      - name: Install dependencies
        run: npm install

      - name: Generate native Android folder
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: egsm-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
