name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK manually
        run: |
          # Set up environment variables
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          
          # Create directories
          mkdir -p $HOME/android-sdk/cmdline-tools
          
          # Download command-line tools (latest version)
          CD_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -sSL $CD_TOOLS_URL -o cmdline-tools.zip
          
          # Extract and structure correctly (cmdline-tools must be inside a 'latest' folder)
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm cmdline-tools.zip

      - name: Install SDK components & accept licenses
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          
          # Accept licenses automatically
          yes | sdkmanager --licenses || true
          
          # Install required components for Expo/Gradle
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install dependencies
        run: npm install

      - name: Generate native Android folder
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: egsm-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
